<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elev - MQTT Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a href="index.html" style="text-decoration: none; color: #888;">&larr; Hjem</a>
                <div>
                    <span class="status-indicator" id="status-dot"></span>
                    <small id="status-text">Frakoblet</small>
                </div>
            </div>
        </header>

        <div id="login-panel" class="card">
            <h2>Bli med</h2>
            <input type="text" id="input-code" placeholder="KODE" style="text-transform: uppercase; font-weight: bold; text-align: center;">
            <button id="btn-join" class="btn">Koble til</button>
        </div>

        <div id="wait-panel" class="card hidden" style="text-align: center;">
            <h2>Venter på lærer...</h2>
            <div style="font-size: 3rem;">⏳</div>
        </div>

        <div id="vote-panel" class="card hidden">
            <h2 id="question-text"></h2>
            <div id="choices-container"></div>
        </div>

        <div id="sent-panel" class="card hidden" style="text-align: center;">
            <h2>Stemme sendt!</h2>
            <div style="font-size: 3rem; color: var(--success);">✔</div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
