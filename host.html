<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lærer - MQTT Host</title>
    <link rel="stylesheet" href="style.css">
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a href="index.html" style="text-decoration: none; color: #888;">&larr; Hjem</a>
                <div>
                    <span class="status-indicator" id="status-dot"></span>
                    <small id="status-text">Kobler til skyen...</small>
                </div>
            </div>
        </header>

        <div id="lobby-panel" class="card">
            <h2>Klasseroms-kode</h2>
            <div style="text-align: center;">
                <p>Koden er:</p>
                <div id="room-code-display" class="big-code">----</div>
                <p><span id="player-count">0</span> elever aktive</p>
                <button id="btn-reconnect" class="btn btn-secondary hidden" style="font-size: 0.8rem; padding: 5px;">Koble til på nytt</button>
            </div>
        </div>

        <div id="create-panel" class="card hidden">
            <h2>Nytt Spørsmål</h2>
            <input type="text" id="input-question" placeholder="Skriv spørsmål her...">
            <div id="options-container">
                <input type="text" class="option-input" placeholder="Alternativ A">
                <input type="text" class="option-input" placeholder="Alternativ B">
            </div>
            <button id="btn-add-option" class="btn btn-secondary">+ Alternativ</button>
            <button id="btn-start-vote" class="btn">Start Avstemning</button>
        </div>

        <div id="results-panel" class="card hidden">
            <h2 id="display-question"></h2>
            <div id="bars-container"></div>
            <div style="margin-top: 20px; text-align: center;">
                <p><span id="votes-received">0</span> stemmer</p>
                <button id="btn-stop-vote" class="btn btn-danger">Avslutt</button>
            </div>
        </div>
        
        <div style="font-size: 0.7rem; color: #ccc; text-align: center;">Powered by HiveMQ/EMQX (MQTT)</div>
    </div>

    <script src="host.js"></script>
</body>
</html>
